project:
  type: website
  output-dir: _site
  post-render: scripts/homepage-semantics.ts
  render:
    - "*.qmd"
    - "**/*.qmd"
    # Keep the IBD Sequence private until the section is ready to launch.
    - "!ibd-sequence/**"

quarto-required: ">= 1.9.0"

# Used by the page-schema Lua filter. Keep this aligned with website.site-url.
schema-site-url: https://mahshadsa.github.io

website:
  title: "Mahshad Sarikhani"
  description: "Physician-researcher working on quantitative MRI, motility, imaging biomarkers, and computational methods in inflammatory bowel disease."
  site-url: https://mahshadsa.github.io
  llms-txt: true
  # Draft IBD Sequence pieces can be developed in-repository without being
  # emitted into the public build or surfaced by listings.
  draft-mode: gone

  open-graph:
    site-name: "Mahshad Sarikhani"
    image: https://mahshadsa.github.io/assets/img/og-image.jpg
    image-alt: "Portrait of Mahshad Sarikhani beside her name and research focus."
    image-width: 1201
    image-height: 630
  twitter-card:
    image: https://mahshadsa.github.io/assets/img/og-image.jpg
    image-alt: "Portrait of Mahshad Sarikhani beside her name and research focus."
    card-style: summary_large_image

  navbar:
    background: light
    foreground: dark
    title: "MS"
    left:
      - text: "Notes"
        href: notes/index.qmd
      - text: "Work"
        menu:
          - text: "Studies"
            href: work/index.qmd#studies
          - text: "Tools"
            href: work/index.qmd#tools
      - text: "Log"
        href: log.qmd
      - text: "About"
        href: about/index.qmd
      - text: "CV"
        href: cv/index.qmd
    right:
      - icon: github
        href: https://github.com/MahshadSa
      - icon: mortarboard-fill
        href: https://scholar.google.com/citations?user=iKhNW9AAAAAJ
      - icon: envelope-fill
        href: "mailto:mah.sarikhani.md@gmail.com"

  page-footer:
    left: "© 2026 MS · Built with [Quarto](https://quarto.org)"

  search:
    location: navbar
    type: overlay

format:
  html:
    include-in-header:
      - text: |
          <meta name="google-site-verification" content="h-3xdvaDhFjhTCq4gbhij_Dcuitz1axWuYGbUmHf9c0" />
      - _includes/favicon.html
      - _includes/schema.html
    include-after-body:
      - _includes/reveal.html
      - _includes/cloudflare-analytics.html
    filters:
      - _filters/page-schema.lua
    theme:
      light: [cosmo, assets/css/custom.scss]
      dark: [cosmo, assets/css/custom-dark.scss]
    css: assets/css/garden.css
    toc: false
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
    fontsize: "1.05rem"
    mainfont: "'Source Serif 4', Georgia, serif"
    monofont: "'JetBrains Mono', monospace"
    grid:
      sidebar-width: 0px
      body-width: 720px
      margin-width: 0px

execute:
  freeze: auto
